<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap to Buy | Your Wishlist</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="wishlist">
    <!-- Sticky Header -->
    <header class="header">
        <div class="header-container">
            <!-- Left: Logo & Brand -->
            <a href="index.html" class="brand">
                <div class="logo">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
                <span class="brand-name">Tap to Buy</span>
            </a>

            <!-- Mobile Hamburger -->
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Center: Navigation -->
            <nav class="nav" id="main-nav">
                <ul class="nav-list">
                    <!-- Nav Items -->
                    <li class="nav-item"><a href="men.html" class="nav-link">Men</a></li>
                    <li class="nav-item"><a href="women.html" class="nav-link">Women</a></li>
                    <li class="nav-item"><a href="kids.html" class="nav-link">Kids</a></li>
                    <li class="nav-item"><a href="home.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="beauty.html" class="nav-link">Beauty</a></li>
                    <li class="nav-item"><a href="genz.html" class="nav-link">Genz</a></li>
                </ul>
            </nav>

            <!-- Right: Search & Icons -->
            <div class="header-actions">
                <!-- Search -->
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" class="search-input" id="search-input" placeholder="Search products...">
                </div>

                <!-- Icons Group -->
                <div class="icons-group">
                    <!-- Wishlist -->
                    <div class="icon-item">
                        <a href="wishlist.html" class="icon-link">
                            <div class="cart-wrapper">
                                <i class="fa-regular fa-heart"></i>
                                <span class="cart-badge" id="wishlist-counter">0</span>
                            </div>
                            <span class="icon-text">Wishlist</span>
                        </a>
                    </div>
                    <!-- Cart -->
                    <div class="icon-item">
                        <a href="cart.html" class="icon-link">
                            <div class="cart-wrapper">
                                <i class="fa-solid fa-cart-shopping"></i>
                                <span class="cart-badge" id="cart-counter">0</span>
                            </div>
                            <span class="icon-text">Cart</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>

        <section class="wishlist-page container">
            <h2 class="page-title">Your Wishlist</h2>
            <div class="product-grid" id="wishlist-grid">
                <!-- Wishlist items injected here -->
            </div>
        </section>
    
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h4>Online Shopping</h4>
                    <ul>
                        <li><a href="men.html">Men</a></li>
                        <li><a href="women.html">Women</a></li>
                        <li><a href="kids.html">Kids</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <div class="guarantee">
                        <i class="fa-solid fa-award guarantee-icon"></i>
                        <div><strong>100% ORIGINAL</strong> guarantee</div>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 www.tap-to-buy.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
